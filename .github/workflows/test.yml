name: test
# Installs and tests the formula as users get it, on macOS and Linux. `update`
# calls it with a candidate formula before publishing one.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate:
        description: Artifact holding a Formula/continuum.rb to test instead of the committed one
        type: string
        default: ''
permissions:
  contents: read
jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Outside the checkout: setup-homebrew resets the tap to the committed tree.
      - if: inputs.candidate != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.candidate }}
          path: ${{ runner.temp }}/candidate
      - id: formula
        env:
          CANDIDATE: ${{ runner.temp }}/candidate/continuum.rb
        run: |
          if [ -f "$CANDIDATE" ] || [ -f Formula/continuum.rb ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No formula released yet."
          fi
      - if: steps.formula.outputs.present == 'true'
        uses: Homebrew/actions/setup-homebrew@main
      - if: steps.formula.outputs.present == 'true' && inputs.candidate != ''
        env:
          CANDIDATE: ${{ runner.temp }}/candidate/continuum.rb
        run: cp "$CANDIDATE" "$(brew --repository maitai-inc/continuum)/Formula/continuum.rb"
      - if: steps.formula.outputs.present == 'true'
        run: brew install maitai-inc/continuum/continuum
      - if: steps.formula.outputs.present == 'true'
        run: brew test maitai-inc/continuum/continuum
      - if: steps.formula.outputs.present == 'true'
        name: Runs in a checkout and asks for credentials
        run: |
          continuum --version | grep -Eq '^continuum [0-9]+\.[0-9]+\.[0-9]+$'
          repo="$(mktemp -d)"; cd "$repo"
          git init -q -b main
          git remote add origin https://github.com/maitai-inc/example.git
          printf 'def value():\n    return 1\n' > core.py
          git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm base
          # No token: the CLI must say how to get one, not fail obscurely.
          if HOME="$(mktemp -d)" CONTINUUM_CONFIG_DIR="$(mktemp -d)" continuum impact 2> err.txt; then
            echo "continuum impact succeeded without credentials" >&2; exit 1
          fi
          cat err.txt >&2
          grep -q 'not_logged_in' err.txt && grep -q 'continuum login' err.txt
